<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#18314f" />
  <title>情報モラル・シミュレーター</title>
  <meta name="description" content="小学校高学年向け。SNS・チャット・生成AI・ゲームを疑似体験しながら情報モラルを考える教材です。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">小学校高学年向け</p>
        <h1>情報モラル・シミュレーター</h1>
      </div>
    </header>

    <main class="main">
      <section class="hero card">
        <div class="hero-copy">
          <span class="badge">45分授業向け</span>
          <h2>送る前に、<br>もう一度考えてみよう。</h2>
          <p>
            SNS、チャット、生成AI、オンラインゲーム。
            「ちょっとだけ」の判断が、その後どうつながるかを安全に疑似体験します。
          </p>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="phone-mini">
            <div class="phone-mini-notch"></div>
            <div class="phone-mini-screen">
              <div class="mini-bubble left">これ送っていい？</div>
              <div class="mini-bubble right">ちょっと待って</div>
              <div class="mini-warning">送る前にチェック</div>
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-heading">
          <div>
            <p class="eyebrow">START</p>
            <h2>どちらを開きますか？</h2>
          </div>
        </div>
        <div class="entry-picker">
          <a class="entry-card card" href="teacher/">
            <span class="mode-icon" aria-hidden="true">🧑‍🏫</span>
            <span class="entry-card-body">
              <strong>先生用（電子黒板）</strong>
              <small>LIVE授業の開始・進行、クラス全体の挙手集計を行う管理画面です。</small>
            </span>
          </a>
          <a class="entry-card card" href="student/">
            <span class="mode-icon" aria-hidden="true">👤</span>
            <span class="entry-card-body">
              <strong>児童用（1人1台端末）</strong>
              <small>電子黒板に表示された6桁の授業コードを入力して参加します。</small>
            </span>
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>疑似体験教材です。氏名・メールアドレス等は入力しません。回答は外部に送信されません。</p>
    </footer>
  </div>
</body>
</html>
